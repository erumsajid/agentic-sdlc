name: greenfield-skeleton
description: Requirement to implementation, with gates
version: 1
nodes:
  - id: REQUIREMENTS
    description: Normalize the raw requirement
    agent: REQUIREMENTS_ANALYST
    produces: [REQUIREMENT_SPEC]
    exitGates:
      - type: SCHEMA_VALID
        rule: REQUIREMENT_SPEC:non-blank
    maxRetries: 2

  - id: DESIGN
    description: Produce the design and API definition
    agent: ARCHITECT
    dependsOn: [REQUIREMENTS]
    consumes: [REQUIREMENT_SPEC]
    produces: [DESIGN_DOC, API_SPEC]
    entryGates:
      - type: ARTIFACT_EXISTS
        rule: REQUIREMENT_SPEC
    exitGates:
      - type: SCHEMA_VALID
        rule: DESIGN_DOC:non-blank
      - type: HUMAN_APPROVAL
        rule: design
    maxRetries: 2

  - id: IMPLEMENT
    description: Generate the code change
    agent: IMPLEMENTER
    dependsOn: [DESIGN]
    consumes: [DESIGN_DOC, API_SPEC]
    produces: [CODE_CHANGESET]
    entryGates:
      - type: ARTIFACT_EXISTS
        rule: DESIGN_DOC
    exitGates:
      - type: QUALITY_CHECK
        rule: CODE_CHANGESET:no-todo-markers
      - type: POLICY_CHECK
        rule: no-secrets
    maxRetries: 3

  - id: TEST_PLAN
    description: Prepare the test strategy and initial test report
    agent: TEST_ENGINEER
    dependsOn: [DESIGN]
    consumes: [API_SPEC]
    produces: [TEST_REPORT]
    entryGates:
      - type: ARTIFACT_EXISTS
        rule: API_SPEC
    exitGates:
      - type: SCHEMA_VALID
        rule: TEST_REPORT:non-blank
    maxRetries: 2

  - id: RELEASE_READINESS
    description: Join implementation and test results for release readiness
    agent: RELEASE_READINESS
    dependsOn: [IMPLEMENT, TEST_PLAN]
    consumes: [CODE_CHANGESET, TEST_REPORT]
    produces: [RELEASE_REPORT]
    entryGates:
      - type: ARTIFACT_EXISTS
        rule: CODE_CHANGESET
      - type: ARTIFACT_EXISTS
        rule: TEST_REPORT
    exitGates:
      - type: SCHEMA_VALID
        rule: RELEASE_REPORT:non-blank
    maxRetries: 1
