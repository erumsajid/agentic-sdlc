spring:
  application:
    name: agentic-orchestrator
  datasource:
    url: jdbc:postgresql://localhost:5432/orchestrator
    username: postgres
    password: root
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
agent:
  llm:
    enabled: false
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-4o-mini}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:60000}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
